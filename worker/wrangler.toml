name = "jeketilive-hls-proxy"
main = "hls-proxy.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# Fetches the master playlist from Asia-Pacific; see hls-proxy.ts.
[[durable_objects.bindings]]
name = "MASTER_FETCHER"
class_name = "MasterFetcher"

# Persisted Workers Logs (dashboard → Logs), so cron results/errors can be checked afterwards.
[observability]
enabled = true

# Live history snapshot (see scheduled() in hls-proxy.ts). Needs secrets CRON_SECRET and SITE_URL.
[triggers]
crons = ["*/5 * * * *"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MasterFetcher"]
