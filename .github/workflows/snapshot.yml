name: Snapshot live sessions

on:
  schedule:
    - cron: '*/5 * * * *' # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -fsS --max-time 60
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          "${{ secrets.SITE_URL }}/api/cron/snapshot"
